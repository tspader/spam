[package]
name = "libx11"
version = "1.8.13"

[package.upstream]
url = "https://gitlab.freedesktop.org/xorg/lib/libx11.git"
commit = "6c75545a1deb51f5903992c52af6bc35cc9bc103"

[package.publish]
include = [
  { from = "include/X11/*.h", to = "X11" },
  { from = "include/X11/extensions/*.h", to = "X11/extensions" },
  { from = "gen/X11/XlibConf.h", tree = "manifest", to = "X11" },
]
