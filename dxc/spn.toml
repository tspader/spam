# DirectXShaderCompiler is a self-contained fork of LLVM/Clang 3.7; nothing
# external is required beyond SPIRV-Tools and DirectX-Headers. Its build-time
# codegen (llvm/clang tablegen, hctgen via python) cannot run in a build
# script, so the outputs are vendored: gen/ mirrors the cmake build tree
# layout and is regenerated by generate.sh; config/ holds hand-unified
# platform config headers derived from cmake configures for linux, windows,
# and macos (see generate.sh for the reference configures).
[package]
name = "dxc"
version = "1.8.2502"

[package.upstream]
url = "https://github.com/libsdl-org/DirectXShaderCompiler.git"
commit = "80a7375441f416f6b3e3df815c14ac9132725450"

[deps.package]
spirv_tools = "2024.4.0"
spirv_headers = "1.4.304"
directx_headers = "1.4.9"

