[package]
name = "fmt"
version = "10.2.1"

[package.upstream]
url = "https://github.com/fmtlib/fmt.git"
commit = "e69e5f977d458f2650bb346dadf2ad30c5320281"

[[lib]]
name = "fmt"
kinds = ["static"]
source = ["src/format.cc", "src/os.cc"]
include = ["include"]
cxx = { standard = "c++17" }

[[example]]
name = "format"
source = [{ path = "example/format.cpp", tree = "manifest" }]
deps = ["fmt"]
cxx = { standard = "c++17" }

[[example]]
name = "filesink"
source = [{ path = "example/filesink.cpp", tree = "manifest" }]
deps = ["fmt"]
cxx = { standard = "c++17" }

[publish]
copy = [
  { from = "source/include/fmt/*", to = "include/fmt" },
]
