[package]
name = "openssl"
version = "4.2.0"
author = "openssl"
maintainer = "tspader"
include = [
  "include",
  { path = "gen/include", tree = "manifest" },
  { path = "config/include", tree = "manifest" },
]
define = [
  { value = "_DEFAULT_SOURCE", when = { os = "linux" } },
  { value = "_REENTRANT", when = { os = { not = "windows" } } },
  { value = "UNICODE", when = { os = "windows" } },
  { value = "_UNICODE", when = { os = "windows" } },
  { value = "WIN32_LEAN_AND_MEAN", when = { os = "windows" } },
  { value = "_MT", when = { os = "windows" } },
  { value = "_CRT_SECURE_NO_DEPRECATE", when = { abi = "msvc" } },
  { value = "_WINSOCK_DEPRECATED_NO_WARNINGS", when = { abi = "msvc" } },
]
system_deps = [
  { lib = "pthread", when = { os = { not = "windows" } } },
  { lib = "dl", when = { os = "linux" } },
  { lib = "ws2_32", when = { os = "windows" } },
  { lib = "gdi32", when = { os = "windows" } },
  { lib = "advapi32", when = { os = "windows" } },
  { lib = "user32", when = { os = "windows" } },
  { lib = "crypt32", when = { os = "windows" } },
  { lib = "bcrypt", when = { os = "windows" } },
]

[package.upstream]
url = "https://github.com/openssl/openssl.git"
commit = "f6eb87c560540cb29cedf5be739b5049bb1a385e"

[[lib]]
name = "crypto"
kinds = ["static"]
include = [
  ".",
  "providers/common/include",
  "providers/fips/include",
  "providers/implementations/include",
  { path = "gen", tree = "manifest" },
  { path = "gen/crypto", tree = "manifest" },
  { path = "gen/crypto/asn1", tree = "manifest" },
  { path = "gen/crypto/bn", tree = "manifest" },
  { path = "gen/crypto/conf", tree = "manifest" },
  { path = "gen/crypto/objects", tree = "manifest" },
  { path = "gen/providers/common/include", tree = "manifest" },
  { path = "gen/providers/implementations/include", tree = "manifest" },
]
define = [
  "L_ENDIAN",
  "STATIC_LEGACY",
  { value = 'OPENSSLDIR="/etc/ssl"', when = { os = { not = "windows" } } },
  { value = 'MODULESDIR="/usr/local/lib/ossl-modules"', when = { os = { not = "windows" } } },
  { value = 'OPENSSLDIR="C:\\Program Files\\Common Files\\SSL"', when = { os = "windows" } },
  { value = 'MODULESDIR="C:\\Program Files\\OpenSSL\\lib\\ossl-modules"', when = { os = "windows" } },
]
