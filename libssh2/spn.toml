[[example]]
name = "ssh2_agent"
source = ["example/ssh2_agent.c"]
deps = ["ssh2"]

[[example]]
name = "ssh2_agent_forwarding"
source = ["example/ssh2_agent_forwarding.c"]
deps = ["ssh2"]

[[example]]
name = "ssh2_echo"
source = ["example/ssh2_echo.c"]
deps = ["ssh2"]

[[example]]
name = "ssh2_exec"
source = ["example/ssh2_exec.c"]
deps = ["ssh2"]

[[example]]
name = "subsystem_netconf"
source = ["example/subsystem_netconf.c"]
deps = ["ssh2"]

[[example]]
name = "tcpip-forward"
source = ["example/tcpip-forward.c"]
deps = ["ssh2"]

[[example]]
name = "x11"
source = ["example/x11.c"]
deps = ["ssh2"]

[publish]
copy = [
  { from = "source/include/*.h", to = "include" },
]
