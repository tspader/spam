source = ["example/scp_write.c"]
deps = ["ssh2"]

[[example]]
name = "scp_write_nonblock"
source = ["example/scp_write_nonblock.c"]
deps = ["ssh2"]

[[example]]
name = "sftp"
source = ["example/sftp.c"]
deps = ["ssh2"]

[[example]]
name = "sftp_RW_nonblock"
source = ["example/sftp_RW_nonblock.c"]
deps = ["ssh2"]

[[example]]
name = "sftp_append"
source = ["example/sftp_append.c"]
deps = ["ssh2"]

[[example]]
name = "sftp_mkdir"
source = ["example/sftp_mkdir.c"]
deps = ["ssh2"]

[[example]]
name = "sftp_mkdir_nonblock"
source = ["example/sftp_mkdir_nonblock.c"]
deps = ["ssh2"]

[[example]]
name = "sftp_nonblock"
source = ["example/sftp_nonblock.c"]
deps = ["ssh2"]

[[example]]
name = "sftp_write"
source = ["example/sftp_write.c"]
deps = ["ssh2"]

[[example]]
name = "sftp_write_nonblock"
source = ["example/sftp_write_nonblock.c"]
deps = ["ssh2"]

[[example]]
name = "sftp_write_sliding"
source = ["example/sftp_write_sliding.c"]
