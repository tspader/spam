[package]
name = "alsa-lib"
version = "1.2.15"
system_deps = [
  { lib = "m", when = { os = "linux" } },
  { lib = "pthread", when = { os = "linux" } },
  { lib = "dl", when = { os = "linux" } },
  { lib = "rt", when = { os = "linux" } },
]

[package.upstream]
url = "https://github.com/alsa-project/alsa-lib.git"
commit = "62c24074ae2a39613b27028cde0bac2a20635ea1"

[[lib]]
name = "asound"
kinds = ["static"]
include = ["include"]
source = [
  "src/conf.c",
  "src/confeval.c",
  "src/confmisc.c",
  "src/input.c",
  "src/output.c",
  "src/async.c",
  "src/error.c",
  "src/dlmisc.c",
  "src/socket.c",
  "src/shmarea.c",
  "src/userfile.c",
  "src/names.c",
  "src/control/cards.c",
  "src/control/tlv.c",
  "src/control/eld.c",
  "src/control/namehint.c",
  "src/control/hcontrol.c",
  "src/control/control.c",
  "src/control/control_hw.c",
  "src/control/control_empty.c",
  "src/control/setup.c",
  "src/control/ctlparse.c",
  "src/control/control_plugin.c",
  "src/control/control_symbols.c",
  "src/control/control_remap.c",
  "src/control/control_shm.c",
  "src/control/control_ext.c",
  "src/mixer/bag.c",
  "src/mixer/mixer.c",
  "src/mixer/simple.c",
  "src/mixer/simple_none.c",
  "src/mixer/simple_abst.c",
  "src/pcm/mask.c",
  "src/pcm/interval.c",
  "src/pcm/pcm.c",
  "src/pcm/pcm_params.c",
  "src/pcm/pcm_simple.c",
  "src/pcm/pcm_hw.c",
  "src/pcm/pcm_misc.c",
  "src/pcm/pcm_mmap.c",
  "src/pcm/pcm_symbols.c",
  "src/pcm/pcm_generic.c",
  "src/pcm/pcm_plugin.c",
  "src/pcm/pcm_copy.c",
  "src/pcm/pcm_linear.c",
  "src/pcm/pcm_route.c",
  "src/pcm/pcm_mulaw.c",
  "src/pcm/pcm_alaw.c",
  "src/pcm/pcm_adpcm.c",
  "src/pcm/pcm_rate.c",
  "src/pcm/pcm_rate_linear.c",
  "src/pcm/pcm_plug.c",
  "src/pcm/pcm_multi.c",
  "src/pcm/pcm_shm.c",
  "src/pcm/pcm_file.c",
  "src/pcm/pcm_null.c",
  "src/pcm/pcm_empty.c",
  "src/pcm/pcm_share.c",
  "src/pcm/pcm_meter.c",
  "src/pcm/pcm_hooks.c",
  "src/pcm/pcm_lfloat.c",
  "src/pcm/pcm_ladspa.c",
  "src/pcm/pcm_dmix.c",
  "src/pcm/pcm_dshare.c",
  "src/pcm/pcm_dsnoop.c",
  "src/pcm/pcm_direct.c",
  "src/pcm/pcm_asym.c",
  "src/pcm/pcm_iec958.c",
  "src/pcm/pcm_softvol.c",
  "src/pcm/pcm_extplug.c",
  "src/pcm/pcm_ioplug.c",
  "src/pcm/pcm_mmap_emul.c",
  "src/timer/timer.c",
  "src/timer/timer_hw.c",
  "src/timer/timer_query.c",
  "src/timer/timer_query_hw.c",
  "src/timer/timer_symbols.c",
  "src/rawmidi/rawmidi.c",
  "src/rawmidi/rawmidi_hw.c",
  "src/rawmidi/rawmidi_symbols.c",
  "src/rawmidi/rawmidi_virt.c",
  "src/rawmidi/ump.c",
  "src/hwdep/hwdep.c",
  "src/hwdep/hwdep_hw.c",
  "src/hwdep/hwdep_symbols.c",
  "src/seq/seq_hw.c",
  "src/seq/seq.c",
  "src/seq/seq_event.c",
  "src/seq/seqmid.c",
  "src/seq/seq_midi_event.c",
  "src/seq/seq_symbols.c",
  "src/seq/seq_old.c",
  "src/ucm/utils.c",
  "src/ucm/parser.c",
  "src/ucm/ucm_cond.c",
  "src/ucm/ucm_subs.c",
  "src/ucm/ucm_include.c",
  "src/ucm/ucm_regex.c",
  "src/ucm/ucm_repeat.c",
  "src/ucm/ucm_exec.c",
  "src/ucm/main.c",
]
flags = ["-std=gnu17"]

[publish]
copy = [
  { from = "source/include/*.h", to = "include/alsa" },
  { from = "source/include/sound/*.h", to = "include/alsa/sound" },
  { from = "source/include/sound/uapi/*.h", to = "include/alsa/sound/uapi" },
]

[[example]]
name = "devices"
source = [{ path = "example/devices.c", tree = "manifest" }]
deps = ["asound"]
flags = ["-std=gnu17"]

[profile.default]
linkage = "shared"
abi = "gnu"
