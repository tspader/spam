[package]
name = "spirv_cross"
version = "1.3.296"

[package.upstream]
url = "https://github.com/KhronosGroup/SPIRV-Cross.git"
commit = "d1d4adbefd411fc4721a2fece15a7f4aaa3dcdfa"

[[lib]]
name = "spirv_cross"
kinds = ["static"]
source = [
  "spirv_cross.cpp",
  "spirv_parser.cpp",
  "spirv_cross_parsed_ir.cpp",
  "spirv_cfg.cpp",
  "spirv_glsl.cpp",
  "spirv_hlsl.cpp",
  "spirv_msl.cpp",
  "spirv_cpp.cpp",
  "spirv_reflect.cpp",
  "spirv_cross_util.cpp",
  "spirv_cross_c.cpp",
]
define = [
  "SPIRV_CROSS_C_API_GLSL",
  "SPIRV_CROSS_C_API_HLSL",
  "SPIRV_CROSS_C_API_MSL",
  "SPIRV_CROSS_C_API_CPP",
  "SPIRV_CROSS_C_API_REFLECT",
]
cxx = { standard = "c++17", exceptions = true, rtti = true }

[publish]
copy = [
  { from = "source/spirv.h", to = "include" },
  { from = "source/spirv_cross_c.h", to = "include" },
]
