# C bindings for Dear ImGui, generated by dear_bindings. The generator is
# python and cannot run in a build script, so the generated sources are
# vendored in gen/; run generate.sh to regenerate them. The version tracks
# imgui exactly; the bindings are only valid against the same imgui source.
#
# imgui does not forward options across packages, so a consumer enabling a
# backend here must enable the matching backend option on imgui too.
[package]
name = "dcimgui"
version = "1.92.8"

[options.internal]
type = "bool"
default = false

[options.sdl2]
type = "bool"
default = false

[options.opengl3]
type = "bool"
default = false

[options.sdl3]
type = "bool"
default = false

[options.sdlgpu3]
type = "bool"
default = false

[deps.package.imgui]
version = "1.92.8"

[[lib]]
name = "dcimgui"
kinds = ["static", "shared"]
source = [
  "gen/dcimgui.cpp",
  { path = "gen/dcimgui_internal.cpp", when = { internal = true } },
  { path = "gen/dcimgui_impl_sdl2.cpp", when = { sdl2 = true } },
  { path = "gen/dcimgui_impl_opengl3.cpp", when = { opengl3 = true } },
  { path = "gen/dcimgui_impl_sdl3.cpp", when = { sdl3 = true } },
  { path = "gen/dcimgui_impl_sdlgpu3.cpp", when = { sdlgpu3 = true } },
]
include = ["gen"]
deps = ["imgui"]
cxx = { standard = "c++17" }

[[example]]
name = "headless"
source = [{ path = "example/headless.c", tree = "manifest" }]
deps = ["dcimgui"]

[config.imgui]
options = { sdl3 = true, sdlgpu3 = true }

[publish]
copy = [
  { from = "source/gen/dcimgui.h", to = "include" },
  { from = "source/gen/dcimgui_internal.h", to = "include" },
  { from = "source/gen/dcimgui_impl_sdl2.h", to = "include" },
  { from = "source/gen/dcimgui_impl_opengl3.h", to = "include" },
  { from = "source/gen/dcimgui_impl_sdl3.h", to = "include" },
  { from = "source/gen/dcimgui_impl_sdlgpu3.h", to = "include" },
]
