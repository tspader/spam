[package]
name = "dcimgui"
version = "1.92.8"

[options.internal]
type = "bool"
default = false

[options.sdl2]
type = "bool"
default = false

[options.opengl3]
type = "bool"
default = false

[options.sdl3]
type = "bool"
default = false

[options.sdlgpu3]
type = "bool"
default = false

[deps.package]
imgui = { version = "=1.92.8", public = true }
sdl3 = { version = "3.4.14", when = { sdlgpu3 = true }, public = true }

[deps.tool]
sp = "5.0.0"
dear_bindings = "0.21.0"

[[tool]]
name = "generate"
source = ["tools/generate.c"]

[[lib]]
name = "dcimgui"
kinds = ["static", "shared"]
source = [
  "gen/dcimgui.cpp",
  { path = "gen/dcimgui_internal.cpp", when = { internal = true } },
  { path = "gen/dcimgui_impl_sdl2.cpp", when = { sdl2 = true } },
  { path = "gen/dcimgui_impl_opengl3.cpp", when = { opengl3 = true } },
  { path = "gen/dcimgui_impl_sdl3.cpp", when = { sdl3 = true } },
  { path = "gen/dcimgui_impl_sdlgpu3.cpp", when = { sdlgpu3 = true } },
]
include = ["gen"]
cxx = { standard = "c++17" }

[[example]]
name = "headless"
source = ["example/headless.c"]
deps = ["dcimgui"]

[profile.default]
options = { sdl3 = true, sdlgpu3 = true }

[config.imgui]
options = { sdl3 = true, sdlgpu3 = true }

[package.publish]
include = [{ from = "gen/*.h", tree = "manifest" }]
